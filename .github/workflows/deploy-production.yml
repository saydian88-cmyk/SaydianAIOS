name: test-build-deploy-production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      admin_only:
        description: Deploy only the admin image
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  images:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/saydianaios/ops-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/saydianaios/ops-api:latest
          cache-from: type=gha,scope=ops-api
          cache-to: type=gha,mode=max,scope=ops-api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.admin
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/saydianaios/ops-admin:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/saydianaios/ops-admin:latest
          cache-from: type=gha,scope=ops-admin
          cache-to: type=gha,mode=max,scope=ops-admin
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.workbench
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/saydianaios/ops-workbench:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/saydianaios/ops-workbench:latest
          cache-from: type=gha,scope=ops-workbench
          cache-to: type=gha,mode=max,scope=ops-workbench

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    environment: production
    env:
      ADMIN_ONLY: ${{ inputs.admin_only || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.TENCENT_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.TENCENT_PORT || '22' }}" "${{ secrets.TENCENT_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload deployment files
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          docker pull "ghcr.io/${{ github.repository_owner }}/saydianaios/ops-admin:${{ github.sha }}"
          if [[ "$ADMIN_ONLY" == "true" ]]; then
            admin_container="$(docker create "ghcr.io/${{ github.repository_owner }}/saydianaios/ops-admin:${{ github.sha }}")"
            docker cp "$admin_container:/usr/share/nginx/html" /tmp/admin-html
            docker rm "$admin_container"
            tar -C /tmp -czf /tmp/saydian-ops-admin-html.tar.gz admin-html
            scp -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -P "${{ secrets.TENCENT_PORT || '22' }}" \
              /tmp/saydian-ops-admin-html.tar.gz \
              "${{ secrets.TENCENT_USER }}@${{ secrets.TENCENT_HOST }}:/tmp/"
          else
            docker pull "ghcr.io/${{ github.repository_owner }}/saydianaios/ops-api:${{ github.sha }}"
            docker pull "ghcr.io/${{ github.repository_owner }}/saydianaios/ops-admin:${{ github.sha }}"
            docker pull "ghcr.io/${{ github.repository_owner }}/saydianaios/ops-workbench:${{ github.sha }}"
            docker save \
              "ghcr.io/${{ github.repository_owner }}/saydianaios/ops-api:${{ github.sha }}" \
              "ghcr.io/${{ github.repository_owner }}/saydianaios/ops-admin:${{ github.sha }}" \
              "ghcr.io/${{ github.repository_owner }}/saydianaios/ops-workbench:${{ github.sha }}" \
              | gzip -1 > /tmp/saydian-ops-images.tar.gz
            sha256sum /tmp/saydian-ops-images.tar.gz > /tmp/saydian-ops-images.tar.gz.sha256
            curl -fsSL --retry 5 --retry-all-errors -o /tmp/ossutil.zip \
              https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip
            echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  /tmp/ossutil.zip" | sha256sum -c -
            unzip -q /tmp/ossutil.zip -d /tmp/ossutil
            ossutil_bin="$(find /tmp/ossutil -type f -name ossutil -print -quit)"
            object_uri="oss://saidian-brand-assets-prod-sz/system-deploy/saydian-ai-os/${{ github.sha }}/saydian-ops-images.tar.gz"
            uploaded_to_oss=false
            cleanup_oss() {
              if [[ "$uploaded_to_oss" == "true" ]]; then
                "$ossutil_bin" rm "$object_uri" \
                  --endpoint https://oss-cn-shenzhen.aliyuncs.com --region cn-shenzhen --force || true
              fi
            }
            trap cleanup_oss EXIT
            "$ossutil_bin" cp /tmp/saydian-ops-images.tar.gz "$object_uri" \
              --endpoint https://oss-cn-shenzhen.aliyuncs.com --region cn-shenzhen --force
            uploaded_to_oss=true
            download_url="$("$ossutil_bin" presign "$object_uri" \
              --endpoint https://oss-cn-shenzhen.aliyuncs.com --region cn-shenzhen --expires-duration 6h \
              | grep -Eo 'https?://[^[:space:]]+' | head -n 1)"
            test -n "$download_url"
            echo "::add-mask::$download_url"
            printf '%s' "$download_url" > /tmp/saydian-ops-images.url
            scp -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -P "${{ secrets.TENCENT_PORT || '22' }}" \
              /tmp/saydian-ops-images.url /tmp/saydian-ops-images.tar.gz.sha256 \
              deploy/docker-compose.prod.yml deploy/gateway-nginx.conf deploy/deploy-ops.sh deploy/set-production-env.py \
              "${{ secrets.TENCENT_USER }}@${{ secrets.TENCENT_HOST }}:/tmp/"
            ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -p "${{ secrets.TENCENT_PORT || '22' }}" "${{ secrets.TENCENT_USER }}@${{ secrets.TENCENT_HOST }}" \
              "sudo bash -lc 'set -euo pipefail; download_url=\$(cat /tmp/saydian-ops-images.url); rm -f /tmp/saydian-ops-images.url /tmp/saydian-ops-images.tar.gz; docker container prune -f >/dev/null; docker image prune -af >/dev/null; curl -fL --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 30 --continue-at - \"\$download_url\" -o /tmp/saydian-ops-images.tar.gz; cd /tmp; sha256sum -c saydian-ops-images.tar.gz.sha256; install -m 644 /tmp/docker-compose.prod.yml /opt/saydian/config/docker-compose.prod.yml; install -m 644 /tmp/gateway-nginx.conf /opt/saydian/config/gateway-nginx.conf; install -m 755 /tmp/deploy-ops.sh /opt/saydian/bin/deploy-ops.sh; install -m 700 /tmp/set-production-env.py /opt/saydian/bin/set-production-env.py; gzip -dc /tmp/saydian-ops-images.tar.gz | docker load; rm -f /tmp/saydian-ops-images.tar.gz /tmp/saydian-ops-images.tar.gz.sha256'"
          fi
      - name: Deploy and verify
        shell: bash
        run: |
          if [[ "$ADMIN_ONLY" == "true" ]]; then
            admin_image="ghcr.io/${{ github.repository_owner }}/saydianaios/ops-admin:${{ github.sha }}"
            ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -p "${{ secrets.TENCENT_PORT || '22' }}" "${{ secrets.TENCENT_USER }}@${{ secrets.TENCENT_HOST }}" \
              "sudo env ADMIN_IMAGE='$admin_image' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          base="/opt/saydian"
          compose="$base/config/docker-compose.prod.yml"
          images="$base/env/images.env"
          production_env="$base/env/production.env"
          previous_admin="$(grep '^OPS_ADMIN_IMAGE=' "$images" | cut -d= -f2-)"
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          tar -C "$build_dir" -xzf /tmp/saydian-ops-admin-html.tar.gz
          rm -f /tmp/saydian-ops-admin-html.tar.gz
          printf 'FROM %s\nCOPY admin-html/ /usr/share/nginx/html/\n' "$previous_admin" > "$build_dir/Dockerfile"
          docker build -t "$ADMIN_IMAGE" "$build_dir"
          sed -i "s|^OPS_ADMIN_IMAGE=.*|OPS_ADMIN_IMAGE=$ADMIN_IMAGE|" "$images"
          docker compose --env-file "$production_env" --env-file "$images" -f "$compose" up -d ops-admin
          docker compose --env-file "$production_env" --env-file "$images" -f "$compose" restart gateway
          healthy=0
          for _ in $(seq 1 20); do
            if curl -fsS -H 'Host: stest.saydian.cn' https://127.0.0.1/saidian-admin/ -k >/dev/null; then
              healthy=1
              break
            fi
            sleep 3
          done
          if [[ "$healthy" != "1" ]]; then
            sed -i "s|^OPS_ADMIN_IMAGE=.*|OPS_ADMIN_IMAGE=$previous_admin|" "$images"
            docker compose --env-file "$production_env" --env-file "$images" -f "$compose" up -d ops-admin
            docker compose --env-file "$production_env" --env-file "$images" -f "$compose" restart gateway
            echo "admin health check failed; previous image restored" >&2
            exit 1
          fi
          docker image prune -af --filter "until=24h" >/dev/null
          REMOTE
          else
            printf '%s' 'admin' | ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -p "${{ secrets.TENCENT_PORT || '22' }}" "${{ secrets.TENCENT_USER }}@${{ secrets.TENCENT_HOST }}" \
              "sudo /opt/saydian/bin/set-production-env.py OPS_ADMIN_USERNAME"
            printf '%s' "${{ secrets.OPS_ADMIN_PASSWORD }}" | ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -p "${{ secrets.TENCENT_PORT || '22' }}" "${{ secrets.TENCENT_USER }}@${{ secrets.TENCENT_HOST }}" \
              "sudo /opt/saydian/bin/set-production-env.py OPS_ADMIN_PASSWORD"
            ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -p "${{ secrets.TENCENT_PORT || '22' }}" "${{ secrets.TENCENT_USER }}@${{ secrets.TENCENT_HOST }}" \
              "sudo GHCR_REPOSITORY='${{ github.repository_owner }}/saydianaios' /opt/saydian/bin/deploy-ops.sh '${{ github.sha }}'"
          fi
